name: Update data and deploy

# Free hosting + free data refresh + free monitoring:
#  1. fetches fresh prices from Yahoo Finance (no API key) and runs health checks,
#  2. commits public/data/latest.json (so Vercel also redeploys),
#  3. builds the site and publishes it on GitHub Pages,
#  4. if the data refresh fails, opens (or updates) a GitHub issue. GitHub emails the repo owner.
#
# Times are UTC. India market hours are 09:15-15:30 IST = 03:45-10:00 UTC.
on:
  schedule:
    - cron: '45 5 * * 1-5'   # 11:15 IST  - morning snapshot
    - cron: '0 8 * * 1-5'    # 13:30 IST  - afternoon snapshot
    - cron: '30 10 * * 1-5'  # 16:00 IST  - after the close (final daily candle)
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/latest.json'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Refresh market data
        id: fetch
        # If Yahoo fails or the data looks broken, the script exits non-zero and the previous file stays.
        continue-on-error: true
        run: |
          pip install -r data-pipeline/requirements.txt
          python data-pipeline/fetch_data.py

      - name: Alert - open or update an issue when the refresh failed
        if: steps.fetch.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data refresh failed';
            const body = `The scheduled data refresh failed on ${new Date().toISOString()}.\n\n` +
              `The site keeps showing the previous data and a warning banner once it is old.\n\n` +
              `Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 });
            const existing = open.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close the alert issue when the refresh works again
        if: steps.fetch.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 });
            for (const i of open.data.filter((x) => x.title === 'Data refresh failed')) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: 'Data refresh is working again. Closing.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' });
            }

      - name: Commit data (also triggers Vercel)
        if: github.event_name != 'push' && steps.fetch.outcome == 'success'
        run: |
          git config user.name "nsestocks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || (git commit -m "data: refresh market data" && git push)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
